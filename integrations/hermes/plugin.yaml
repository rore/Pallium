name: pallium-hermes-relay
version: 0.2.0
description: Pallium Relay, Session History and opt-in memory through session-scoped Hermes plugin APIs.
author: Pallium
kind: standalone
platforms:
  - windows
provides_tools:
  - pallium_relay_address
  - pallium_relay_recipients
  - pallium_relay_discover_recipients
  - pallium_relay_name
  - pallium_relay_work_refs
  - pallium_relay_attach_work_ref
  - pallium_relay_detach_work_ref
  - pallium_relay_participants
  - pallium_relay_send
  - pallium_relay_reply
  - pallium_relay_status
  - pallium_relay_trace
  - pallium_search_history
  - pallium_search_history_by_work_ref
  - pallium_expand_source
  - pallium_query
  - pallium_expand
  - pallium_ingest
  - pallium_remember
  - pallium_correct
  - pallium_supersede
  - pallium_forget
  - pallium_forget_source
  - pallium_record_outcome
  - pallium_flag_memory
  - pallium_rate_memory
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - on_session_end
  - on_session_finalize
  - on_session_delete
provides_middleware:
  - llm_execution
  - tool_execution
