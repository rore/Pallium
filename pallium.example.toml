[retention]
enabled = false
run_interval_seconds = 300
lease_seconds = 300
batch_size = 200

default_use_case = "agent_conversation_memory"

[storage]
backend = "sqlite"
sqlite_url = "sqlite:///./pallium.db"

[observability]
integration_debug = false

[llm_providers.openai]
kind = "openai_compatible"
base_url = "https://api.openai.com/v1"
api_key_env = "PALLIUM_OPENAI_API_KEY"
timeout_seconds = 30
max_attempts = 3
base_backoff_ms = 250
max_backoff_ms = 3000
jitter_ratio = 0.2
max_concurrency = 4

# [llm_providers.anthropic]
# kind = "anthropic_claude"
# base_url = "https://api.anthropic.com/v1"
# api_key_env = "ANTHROPIC_API_KEY"
# timeout_seconds = 30
# auth_style = "native"  # use "bearer" for proxy endpoints

[semantic_packages.demo_agent_memory]
implementation = "demo_agent_memory"

[semantic_packages.llm_agent_memory]
implementation = "llm_agent_memory"
llm_provider = "openai"
model = "gpt-5-mini"
prompt_variant = "strict_typed_memory_v5_compact_examples"

[semantic_packages.agent_conversation_memory]
implementation = "agent_conversation_memory"
llm_provider = "openai"
model = "gpt-5-mini"
prompt_variant = "strict_typed_memory_v6_work_state_examples"
resolver_enabled = true
resolver_timeout_ms = 800

[semantic_packages.agent_conversation_memory.prompt_variants]
query_ambiguity_resolution = "qar_v1_compact_contract"

# Model roles: use Sonnet for quality-critical extraction, Haiku for simpler background roles.
# Benchmarked: Haiku background matches or improves Sonnet on routing (11/11) and work resumption (100% contract).
[semantic_packages.agent_conversation_memory.model_roles]
thread_aggregation = "claude-haiku-4-5"
consolidation = "claude-haiku-4-5"
query_ambiguity_resolution = "claude-haiku-4-5"

[semantic_packages.agent_conversation_memory.consolidation]
enabled_strategies = ["thread_local_carry_forward", "container_topic_window", "thread_summary_anchored"]
default_strategy = "thread_summary_anchored"
max_candidates_per_run = 24
max_group_size = 4
same_container_required = true
time_window_hours = 168
lexical_overlap_threshold = 2

[embedding_providers.onnx]
kind = "onnx"
model = "BAAI/bge-small-en-v1.5"
# query_prefix = "query: "     # prefix for query-time embedding (e.g., E5 models)
# passage_prefix = "passage: " # prefix for document-time embedding (e.g., E5 models)

[vector_index]
enabled = true
index_path = "./pallium_vector.index"
embedding_provider = "onnx"
min_similarity = 0.55
