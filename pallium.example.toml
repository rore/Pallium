[retention]
enabled = false
run_interval_seconds = 300
lease_seconds = 300
batch_size = 200

default_use_case = "agent_conversation_memory"

[storage]
backend = "sqlite"
sqlite_url = "sqlite:///./pallium.db"

[observability]
integration_debug = false

[llm_providers.openai]
kind = "openai_compatible"
base_url = "https://api.openai.com/v1"
api_key_env = "PALLIUM_OPENAI_API_KEY"
timeout_seconds = 30
max_attempts = 3
base_backoff_ms = 250
max_backoff_ms = 3000
jitter_ratio = 0.2
max_concurrency = 4

# [llm_providers.anthropic]
# kind = "anthropic_claude"
# base_url = "https://api.anthropic.com/v1"
# api_key_env = "ANTHROPIC_API_KEY"
# timeout_seconds = 30
# auth_style = "native"  # use "bearer" for proxy endpoints

[semantic_packages.demo_agent_memory]
implementation = "demo_agent_memory"

[semantic_packages.agent_conversation_memory]
implementation = "agent_conversation_memory"
llm_provider = "openai"
model = "gpt-5-mini"
prompt_variant = "strict_typed_memory_v6_work_state_examples"
resolver_enabled = true
resolver_timeout_ms = 800

[semantic_packages.agent_conversation_memory.prompt_variants]
query_ambiguity_resolution = "qar_v1_compact_contract"

# Model roles: use Sonnet for quality-critical extraction, Haiku for simpler background roles.
# Benchmarked: Haiku background matches or improves Sonnet on routing (11/11) and work resumption (100% contract).
[semantic_packages.agent_conversation_memory.model_roles]
thread_aggregation = "claude-haiku-4-5"
consolidation = "claude-haiku-4-5"
query_ambiguity_resolution = "claude-haiku-4-5"

[semantic_packages.agent_conversation_memory.consolidation]
enabled_strategies = ["thread_local_carry_forward", "container_topic_window", "thread_summary_anchored"]
default_strategy = "thread_summary_anchored"
max_candidates_per_run = 24
max_group_size = 4
same_container_required = true
time_window_hours = 168
lexical_overlap_threshold = 2

[embedding_providers.onnx]
kind = "onnx"
model = "intfloat/multilingual-e5-small"
# model = "BAAI/bge-small-en-v1.5"  # English-only alternative (no prefixes needed)
# E5-family models auto-detect query/passage prefixes. Override only if needed:
# query_prefix = "query: "
# passage_prefix = "passage: "

[vector_index]
enabled = true
index_path = "./vector_index"
embedding_provider = "onnx"
min_similarity = 0.55

# ── Injection policy abstention (Phase 3b — uncomment to enable) ────────
#
# See docs/specs/2026-06-27-injection-policy-abstention.md.
#
# When this block is ABSENT (the default) the abstention policy is a
# bit-exact no-op — every memory type is proactively injectable as before.
#
# The block below is the recommendation that emerges from Phase 1+2a
# evaluation: no type meets the >=70% precision pass bar on chronological
# holdout, so the proactive set is empty. Demoted types are still
# retrievable on-demand:
#
#  - investigation_outcome: surfaced by the PostToolUse failure +
#    retry-threshold triggers (Phase 4 hooks).
#  - thread_summary: explicit pallium_query only.
#  - fact_summary: pipeline known broken (architect review 616f2f55);
#    suspended until reconsidered.
#  - task_checkpoint: switches to event-trigger model (session-resumption
#    via SessionStart hook, plus the new PostToolUse triggers).
#
# Per-container overrides match the query's container_ref exactly:
#
# [injection.policy.types.investigation_outcome]
# mode = "on_demand"
#
# [injection.policy.types.thread_summary]
# mode = "on_demand"
#
# [injection.policy.types.fact_summary]
# mode = "suspended"
#
# [injection.policy.types.task_checkpoint]
# mode = "event"
#
# # W4: operational_fact ships on-demand only. The routing gate ALSO
# # enforces on_demand as the built-in default even if this block is
# # commented out, so ranking is safe by default. See
# # docs/specs/2026-05-31-operational-fact-memory-design.md.
# [injection.policy.types.operational_fact]
# mode = "on_demand"
#
# # W4 PR 3: turn on structural derivation of operational_fact memories
# # from the agent_work_trace_turn metadata. Bit-exact no-op when False
# # (task_trace still writes as before; zero operational_fact rows).
# # Fresh installs SHOULD leave this False until they see the type is
# # useful in their own workflow — the derivation adds a small write-side
# # cost per thread rebuild and the retrieval side is opt-in via the
# # UserPromptSubmit operational_intent signal.
# [features]
# operational_fact_derivation = false
#
# # Per-container override example: disable proactive on the xlm container
# # while leaving the focused-repo container free to override differently.
# [[injection.policy.containers]]
# container_ref = "path:xlm:2889e4f8fd37"
# [injection.policy.containers.types.task_checkpoint]
# mode = "on_demand"
