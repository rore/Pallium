const button=(label,action)=>`<button type="button" class="pd-link" data-action="${action}">${label}</button>`;
function heading(title,description,aside){return `<section class="pd-head"><div><h1>${title}</h1><p>${description}</p></div><div class="pd-time"><strong>Today · 09:00–10:00</strong>${aside}</div></section>`}
function ops(){const h=history.find(h=>h.id===historyId);main.innerHTML=heading('Operations','Service health, recorded work, and inspection.','Illustrative snapshot · 10:00')+`<div class="pd-content"><div class="pd-statusline"><span class="pd-statusdot"></span>Service available · History healthy · Relay needs attention</div><div class="pd-notice"><span class="pd-notice-icon">△</span><div class="pd-notice-copy"><strong>1 delivery expired</strong><span>A client question reached its expiry before delivery.</span></div>${button('Inspect in Relay →','expired')}</div><div class="pd-caps"><article class="pd-cap"><h2>Session History</h2><span class="pd-health"><i></i>Healthy</span><p>Recording active · lexical + vector search ready</p><div class="pd-cap-foot"><span>4 recorded turns</span><small>This window</small></div></article><article class="pd-cap"><h2>Relay</h2><span class="pd-tag amber">Needs attention</span><p>4 delivered · 1 pending · 1 expired</p><div class="pd-cap-foot"><span>6 messages</span>${button('Open workspace','relay')}</div></article><article class="pd-cap"><h2>Derived Memory</h2><span class="pd-health off">Disabled</span><p>Not enabled. Existing stored outputs are preserved.</p><div class="pd-cap-foot"><span>No extraction running</span></div></article></div><div class="pd-section-head"><h2>Recent Session History</h2>${button(allHistory?'Show recent':'View all 4 turns','history')}</div><div class="pd-table-wrap"><table class="pd-table"><thead><tr><th>Time</th><th>Session / tool</th><th>Recorded work</th></tr></thead><tbody>${(allHistory?history:history.slice(0,3)).map(x=>`<tr><td>${x.time}</td><td>${esc(name(x.session))}<br><small>${session(x.session).tool}</small></td><td><button class="pd-history-row" data-history="${x.id}" aria-pressed="${historyId===x.id}">${esc(x.text.slice(0,85))}…</button></td></tr>`).join('')}</tbody></table></div><div class="pd-detail"><article class="pd-detail-panel"><h3>Recorded turn · ${h.role}</h3><p class="pd-detail-message">${esc(h.text)}</p><details><summary>Surrounding context</summary><p class="pd-detail-message">User: Preserve compatibility with the previous client.</p><p class="pd-detail-message">Assistant: I will check the contract and add a regression fixture.</p></details></article><aside class="pd-detail-panel"><h3>Source details</h3><div class="pd-meta"><div><label>Repository</label><span>${session(h.session).repo}</span></div><div><label>Recorded</label><span>${h.time}</span></div><div><label>Work reference</label><span>${h.ref}</span></div><div><label>Source ID</label><code>${h.id}</code></div></div></aside></div><details class="pd-eval"><summary>Operational diagnostics · storage, indexing, retention</summary><div class="pd-detail"><article class="pd-detail-panel"><h3>Recording and search</h3><p>Last recorded turn 09:34 · lexical index ready · vector provider available.</p><p>Main database 42 MB · Relay database 3 MB · vector index 8 MB.</p></article><article class="pd-detail-panel"><h3>Retention</h3><p>Last sweep 09:50 · no maintenance errors.</p><p>1 Relay message waiting for a recipient turn. Pending is not a failure.</p></article></div></details><details class="pd-eval"><summary>Evaluation reports · offline · generated 2026-09-06</summary><p>Historical-reuse and representation comparisons remain available here, separately from live service health.</p></details></div>`}
function filtered(){return messages.filter(m=>(status==='all'||m.status===status)&&(!pair||(m.from===pair[0]&&m.to===pair[1])||(m.from===pair[1]&&m.to===pair[0]))&&(!selected||m.from===selected||m.to===selected))}
function graph(){const edges=[['api','review'],['review','api'],['client','api'],['docs','api']];return `<div class="pd-graph"><svg viewBox="0 0 600 490" role="group" aria-label="All six messages across five sessions"><defs><marker id="pd-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#85baff"/></marker></defs>${edges.map(([a,b],i)=>{const d=['M205 101 Q285 32 365 101','M365 130 Q285 195 205 130','M125 245 L125 145','M365 270 Q270 230 205 140'][i];return `<g role="button" tabindex="0" data-pair="${a},${b}" aria-label="Messages from ${name(a)} to ${name(b)}"><path d="${d}" fill="none" stroke="transparent" stroke-width="22"/><path class="edge" d="${d}" style="stroke:#85baff;marker-end:url(#pd-arrow)"/></g>`}).join('')}${sessions.map(s=>`<g role="button" tabindex="0" data-node="${s.id}" aria-label="Select ${name(s.id)}"><rect class="pd-node ${selected===s.id?'active':''} ${count(s.id)?'':'zero'}" x="${s.x}" y="${s.y}" width="160" height="78" rx="9"/><text class="pd-node-label" x="${s.x+12}" y="${s.y+25}">${esc(name(s.id))}</text><text class="pd-node-sub" x="${s.x+12}" y="${s.y+46}">${s.repo}</text><text class="pd-node-sub" x="${s.x+12}" y="${s.y+64}">${s.tool} · ${count(s.id)}</text></g>`).join('')}</svg><div class="pd-graph-caption">All 6 messages in this window. Select a session or connection. Dashed node: no messages.</div></div>`}
function list(){const rows=filtered();return `<div class="pd-messages"><div class="pd-message-head"><h3>${pair?esc(name(pair[0]))+' ↔ '+esc(name(pair[1])):selected?esc(name(selected)):'All messages'}</h3><span>${rows.length} messages</span></div><div class="pd-chain">${rows.length?rows.map(m=>`<button class="pd-message-button" type="button" data-msg="${m.id}" aria-pressed="${picked===m.id}"><span class="pd-msg-top"><strong>${esc(name(m.from))} → ${esc(name(m.to))}</strong><time>${m.time}</time></span><span class="pd-message-copy">${esc(m.text)}</span><span class="pd-msg-foot"><span class="pd-tag ${m.status==='expired'?'amber':m.status==='delivered'?'green':''}">${m.status}</span><span>${m.kind}</span>${m.reply?`<span>Reply to ${m.reply}</span>`:'<span>New exchange</span>'}</span></button>`).join(''):'<p class="pd-empty">No messages match this selection.</p>'}</div></div>${rows.some(m=>m.id===picked)?detail(messages.find(m=>m.id===picked)):''}`}
function detail(m){return `<article class="pd-detail-panel" style="margin-top:12px"><h3>Delivery detail · ${m.id}</h3><div class="pd-meta"><div><label>Status</label><span>${m.status}</span></div><div><label>Address used at send</label><code>${esc(m.selector)}</code></div><div><label>Recipient endpoint</label><code>relay-session-${m.to}</code></div><div><label>${m.status==='delivered'?'Delivery recorded':m.status==='expired'?'Expired':'Waiting since'}</label><span>${m.status==='delivered'?m.time+':02':m.status==='expired'?'09:43':m.time}</span></div></div><p class="pd-subtle">${m.status==='delivered'?'Delivery confirms admission to the session, not that the agent acted on it.':m.status==='pending'?'Retained for the next eligible recipient turn. Wake outcome is not recorded.':'Expiry ended delivery eligibility; stored message details remain inspectable.'}</p>${m.reply?`<button class="pd-link" data-parent="${m.reply}">Open parent message ${m.reply}</button>`:''}</article>`}
function naming(){if(!selected)return '';const s=session(selected);return `<article class="pd-detail-panel" style="margin-top:12px"><h3>${esc(name(s.id))} · session details</h3><div class="pd-meta"><div><label>Endpoint</label><code>relay-session-${s.id}</code></div><div><label>Container</label><span>${s.repo}</span><br><code>git:example.test/demo/${s.repo}</code></div><div><label>Coding tool</label><span>${s.tool}</span></div><div><label>Last seen</label><span>${s.seen}</span></div></div><form id="pd-alias-form" class="pd-alias-form"><label>Alias<input name="alias" aria-label="Session alias" value="${esc(s.alias)}" placeholder="Give this session a name" maxlength="40"></label><button type="button" data-save-alias>Save alias</button><button type="button" data-action="remove">Remove</button></form><p class="pd-alias-note" role="status">${esc(error||'Names are optional. Changes here affect this preview only.')}</p></article>`}
function relay(){main.innerHTML=heading('Relay','Find sessions and follow their exchanges.','5 known sessions · all 6 messages')+`<div class="pd-content"><div class="pd-relay-layout"><aside class="pd-sessions"><div class="pd-session-title"><h2>Sessions</h2>${button('All','all')}</div><input class="pd-session-search" aria-label="Filter sessions" placeholder="Name, tool or repository" value="${esc(query)}">${sessions.map(s=>`<button class="pd-session" data-session="${s.id}" aria-pressed="${selected===s.id}" data-search="${esc((name(s.id)+' '+s.tool+' '+s.repo).toLowerCase())}"><strong>${esc(name(s.id))}</strong><small>Container: ${s.repo}</small><small>${s.tool}</small><small>Last seen ${s.seen}</small></button>`).join('')}</aside><section class="pd-relay-main"><div class="pd-relay-toolbar"><div class="pd-viewtabs"><button data-mode="map" aria-pressed="${mode==='map'}">Map</button><button data-mode="messages" aria-pressed="${mode==='messages'}">Messages</button></div><label class="pd-status-filter">Delivery <select aria-label="Delivery status"><option value="all">All states</option><option value="delivered">Delivered</option><option value="pending">Pending</option><option value="expired">Expired</option></select></label></div>${mode==='map'?graph():''}${list()}${naming()}</section></div></div>`;main.querySelector('select').value=status;filterSessions()}
function filterSessions(){root.querySelectorAll('[data-search]').forEach(b=>b.hidden=!b.dataset.search.includes(query.toLowerCase()))}

const expanded={};
function arrangeCapabilities(){
 const content=main.querySelector('.pd-content'), caps=content.querySelector('.pd-caps');
 const cards=[...caps.children], historyNodes=[content.querySelector('.pd-section-head'),content.querySelector('.pd-table-wrap'),content.querySelector('.pd-detail')];
 const definitions=[['history','Session History · Healthy · 4 recorded turns'],['relay','Relay · 1 pending · 1 expired'],['memory','Derived Memory · Processing disabled · 2 preserved memories']];
 definitions.forEach(([id,title],i)=>{
  const section=document.createElement('details');section.className='pd-capability';section.open=!!expanded[id];
  const summary=document.createElement('summary');summary.textContent=title;section.append(summary);
  if(id==='history')historyNodes.forEach(n=>section.append(n));
  if(id==='relay')section.append(cards[1]);
  if(id==='memory')section.insertAdjacentHTML('beforeend','<p>New derivation is disabled. Stored memories remain available for inspection.</p><h3>Memory Browser</h3><details class="pd-detail-panel"><summary>Preserve response compatibility</summary><p>Keep the legacy response field while earlier client versions are supported.</p><p class="pd-subtle">Memory mem-1 · Container service-api · Derived from stored source h2 · Historical output</p></details><details class="pd-detail-panel"><summary>Document both response fields</summary><p>Migration examples should show both fields during the transition.</p><p class="pd-subtle">Memory mem-2 · Container developer-docs · Derived from stored source h4 · Historical output</p></details><details class="pd-eval"><summary>Query Debug</summary><p>Production retains the existing query trace inspector here. This mock demonstrates its location only.</p></details>');
  section.addEventListener('toggle',()=>expanded[id]=section.open);caps.before(section);
 });caps.remove();
}

function render(){root.classList.toggle('pd-compact',options.compact);root.querySelectorAll('[data-nav]').forEach(b=>b.setAttribute('aria-selected',b.dataset.nav===view));view==='operations'?ops():relay();if(view==='operations')arrangeCapabilities()}
root.addEventListener('click',e=>{let el=e.target.closest('[data-nav],[data-mode],[data-action],[data-session],[data-node],[data-msg],[data-pair],[data-history],[data-parent]');if(!el)return;const d=el.dataset;error='';if(d.nav)view=d.nav;if(d.mode)mode=d.mode;if(d.session||d.node){selected=d.session||d.node;pair=null;status='all'}if(d.pair){pair=d.pair.split(',');selected=null;status='all';mode='messages'}if(d.msg)picked=d.msg;if(d.history)historyId=d.history;if(d.parent){picked=d.parent;selected=null;pair=null;status='all';mode='messages'}if(d.action==='expired'){view='relay';mode='messages';status='expired';selected=null;pair=null;picked='m5'}if(d.action==='relay')view='relay';if(d.action==='all'){selected=null;pair=null;status='all'}if(d.action==='history')allHistory=!allHistory;if(d.action==='remove')session(selected).alias='';render()});
root.addEventListener('input',e=>{if(e.target.matches('.pd-session-search')){query=e.target.value;filterSessions()}});
root.addEventListener('change',e=>{if(e.target.matches('[aria-label="Delivery status"]')){status=e.target.value;selected=null;pair=null;mode='messages';picked=messages.find(m=>status==='all'||m.status===status)?.id;render()}});
root.addEventListener('click',e=>{if(!e.target.closest('[data-save-alias]'))return;const a=root.querySelector('[name=alias]').value.trim();if(sessions.some(s=>s.id!==selected&&a&&s.alias.toLowerCase()===a.toLowerCase()))error='That alias belongs to another session. Choose another name.';else{session(selected).alias=a;error='Alias saved for this preview.'}render()});
root.addEventListener('keydown',e=>{if(e.target.matches('g[role="button"]')&&['Enter',' '].includes(e.key)){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
render();if(globalThis.Tweak){const t=new Tweak({container:root,onChange:()=>{view=options.startView;render()}});t.addToggle(options,'compact',{label:'Compact spacing'});t.addSelect(options,'startView',{label:'Start view',options:['operations','relay']})}
})();

</script>
</div>

</body></html>
