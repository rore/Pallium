[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pallium"
version = "0.1.0"
description = "Generic memory engine for agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Rotem Hermon", email = "rotem.hermon@gmail.com" },
]

dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "pydantic>=2.10,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.34,<1.0",
    "prompt_toolkit>=3.0,<4.0",
]

[project.urls]
Repository = "https://github.com/rore/Pallium"

[project.optional-dependencies]
vector = [
    "usearch>=2.9,<3.0",
    "onnxruntime>=1.17,<2.0",
    "tokenizers>=0.21,<1.0",
]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-xdist>=3.6,<4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow' -n 4 --import-mode=importlib"
markers = [
    "slow: benchmark and eval harness tests — run explicitly with -m slow",
]
filterwarnings = [
    "ignore::DeprecationWarning:sqlalchemy",
]

[tool.setuptools]
packages = [
    "app",
    "api",
    "core",
    "evals",
    "providers",
    "providers.embedding",
    "providers.llm",
    "retrieval",
    "semantic",
    "storage",
]
