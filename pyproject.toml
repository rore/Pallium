[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pallium"
version = "0.1.0"
description = "Generic memory engine for agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "pydantic>=2.10,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = [
    "app",
    "api",
    "core",
    "evals",
    "providers",
    "providers.llm",
    "retrieval",
    "semantic",
    "storage",
]
