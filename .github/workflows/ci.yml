name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registration-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.16"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies using existing CI recipe
        run: pip install -e ".[dev,vector,mcp]"
      - name: Record actual runtime and verify observer controls
        run: |
          mkdir -p test-results
          python -c 'import importlib.metadata as m,json,platform,sqlite3,sys; print(json.dumps({"python":sys.version,"platform":platform.platform(),"sqlite":sqlite3.sqlite_version,"packages":{d.metadata["Name"]:d.version for d in m.distributions()}},indent=2))' > test-results/runtime.json
          python .github/diagnostics/check_probe.py
      - name: Observe one exact original parameter once
        shell: bash
        env:
          PYTHONPATH: .github/diagnostics:.
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 120s python -m pytest 'tests/test_codex_wake.py::test_atomic_reply_releases_first_and_dispatches_next_pending_once[claude-code]' -p registration_probe -q -n 0 --junitxml=test-results/registration.xml > test-results/pytest.log 2>&1
          status=$?
          printf '%s\n' "$status" > test-results/pytest-exit-status.txt
          tail -n 60 test-results/pytest.log
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registration-observation-${{ github.run_id }}
          path: test-results/
          if-no-files-found: error
          retention-days: 7