name: PR367 single causal diagnostic (not release CI)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  single-linux-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"
      - name: Install isolated diagnostic dependencies
        run: pip install -e ".[dev,vector,mcp]" "SQLAlchemy==2.1.6"
      - name: Verify comparable runtime and frozen subject
        run: |
          mkdir -p test-results
          python - <<'PY'
          import hashlib, json, platform, sqlite3, sqlalchemy
          from pathlib import Path
          versions = {"platform": platform.system(), "python": platform.python_version(),
                      "sqlite": sqlite3.sqlite_version, "sqlalchemy": sqlalchemy.__version__}
          Path("test-results/runtime.json").write_text(json.dumps(versions), encoding="utf-8")
          print(versions)
          assert versions == {"platform": "Linux", "python": "3.12.15", "sqlite": "3.45.1", "sqlalchemy": "2.1.6"}, "Runtime mismatch; not comparable"
          expected = {"app/mcp/codex_desktop_bridge.py": "3b696b922e5193ead32c7fb0bcb606d7c3f5cb7f4d91f92c971d874ccf996b27",
                      "tests/test_codex_retained_connection_recovery.py": "1f3e24bf3eeb6401390205fee6adfbb3857afdc87a9a0dad9d6298e7a6d9c8ca",
                      "tests/test_hermes_relay_plugin.py": "692b82303f9d3385f5c2043adda8b421f4a26fd2631964134a3cfdacfa0edeee",
                      "storage/sqlite_queue.py": "dde8dfe79eed27b626fc45af1b6d5b870082926a7cdfa36647e61a2b40ebda0c"}
          for name, digest in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          PY
          pip freeze > test-results/dependencies.txt
      - name: Execute exact reply node once with native clocks
        id: subject
        run: python -m pytest tests/test_hermes_relay_plugin.py::test_hermes_pending_read_and_reply_lifecycle -p tests.pr367_setup_cpu_diagnostic -q -n 0 --junitxml=test-results/subject.xml
      - name: Verify observer coverage without changing the subject outcome
        if: always() && (steps.subject.outcome == 'success' || steps.subject.outcome == 'failure')
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("test-results/pr367-phase-cpu.json").read_text())
          assert report["subject_reply_calls"] == 1 and not report["observer_errors"], report
          assert 1 <= len(report["samples"]) <= 4, report
          assert all(sample["sqlite_cursor_execute"] for sample in report["samples"]), report
          PY
      - name: Preserve single diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr367-single-linux-causal
          path: test-results/
          if-no-files-found: error
          retention-days: 7
