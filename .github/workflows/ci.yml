name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile_linux:
        description: Capture Python stacks during the Linux test matrix
        type: boolean
        required: false
        default: false
  schedule:
    # Nightly full run (incl. the full Windows matrix). Off-peak, off :00.
    - cron: "17 6 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.plan.outputs.lane }}
      selector_error: ${{ steps.plan.outputs.selector_error }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Select checks from trusted base policy
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          lane=full
          selector_error=false
          if [[ "$EVENT" != schedule && "$EVENT" != workflow_dispatch ]]; then
            trusted="$BASE"
            if [[ "$EVENT" == pull_request ]]; then
              trusted=$(git merge-base "$BASE" "$HEAD") || trusted=""
            fi
            # Missing history/policy (including rollout) safely keeps the full lane.
            if [[ -n "$trusted" ]] && git show "$trusted:scripts/test-plan.py" > "$RUNNER_TEMP/trusted-test-plan.py"; then
              if python "$RUNNER_TEMP/trusted-test-plan.py" --repo-root "$GITHUB_WORKSPACE" --base "$trusted" --head "$HEAD" --exact > "$RUNNER_TEMP/test-plan.json"; then
                if ! lane=$(python -c 'import json,sys; p=json.load(open(sys.argv[1])); lane=p["lane"]; assert lane in ("docs","governance","full"); print(lane)' "$RUNNER_TEMP/test-plan.json"); then
                  lane=full
                  selector_error=true
                fi
              else
                lane=full
                selector_error=true
              fi
            fi
          fi
          echo "lane=$lane" >> "$GITHUB_OUTPUT"
          echo "selector_error=$selector_error" >> "$GITHUB_OUTPUT"
          echo "Validation lane: $lane; selector error: $selector_error" >> "$GITHUB_STEP_SUMMARY"

  focused:
    needs: select
    if: needs.select.outputs.lane == 'docs' || needs.select.outputs.lane == 'governance'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.select.outputs.lane == 'governance' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install focused test dependencies
        run: pip install "pytest>=8.3,<9" "pytest-xdist>=3.6,<4" pyyaml jsonschema
      - name: Check documentation and selection contracts
        if: needs.select.outputs.lane == 'docs'
        run: python -m pytest --noconftest -q -n 0 tests/test_test_plan.py tests/test_ci_workflow.py --durations=20
      - name: Check governance caller contracts
        if: needs.select.outputs.lane == 'governance'
        run: python -m pytest --noconftest -q -n 0 tests/test_test_plan.py tests/test_ci_workflow.py tests/test_agent_workflow_ci.py --durations=20

  # Full application coverage for application/unknown changes and scheduled/manual runs.
  test:
    needs: select
    if: needs.select.outputs.lane == 'full'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev,vector,mcp]"

      - name: Verify MCP test dependency
        run: python -c "import mcp; import app.mcp.server"

      - name: Install Linux stack sampler
        if: github.event_name == 'workflow_dispatch' && inputs.profile_linux
        run: |
          python -m venv "$RUNNER_TEMP/py-spy-venv"
          "$RUNNER_TEMP/py-spy-venv/bin/python" -m pip install py-spy==0.4.2

      - name: Run tests
        if: github.event_name != 'workflow_dispatch' || !inputs.profile_linux
        run: python -m pytest tests/ -x -q --durations=20

      - name: Capture Linux Python stacks
        if: github.event_name == 'workflow_dispatch' && inputs.profile_linux
        env:
          CAPTURE_DIR: ${{ runner.temp }}/linux-python-stacks
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import signal
          import subprocess
          import sys
          import time

          capture_dir = Path(os.environ["CAPTURE_DIR"])
          capture_dir.mkdir(parents=True, exist_ok=False)
          private_dir = capture_dir.parent / "linux-python-stacks-private"
          private_dir.mkdir(parents=True, exist_ok=False)
          profile = capture_dir / "python-stacks.speedscope.json"
          raw_profile = private_dir / "raw.speedscope.json"
          status_path = private_dir / "pytest-status.json"
          launcher = private_dir / "run_pytest.py"
          pytest_command = [sys.executable, "-m", "pytest", "tests/", "-x", "-q", "--durations=20"]
          launcher.write_text(
              "import json, subprocess, sys\n"
              "from pathlib import Path\n"
              f"command = {pytest_command!r}\n"
              "result = subprocess.run(command, check=False)\n"
              f"Path({str(status_path)!r}).write_text("
              "json.dumps({'pytest_exit': result.returncode}) + '\\n', encoding='utf-8')\n"
              "raise SystemExit(result.returncode)\n",
              encoding="utf-8",
          )
          sampler_command = [
              os.path.join(os.environ["RUNNER_TEMP"], "py-spy-venv", "bin", "py-spy"),
              "record", "--format", "speedscope", "--rate", "5",
              "--subprocesses", "--threads", "--idle", "--nonblocking",
              "--output", str(raw_profile), "--", sys.executable, str(launcher),
          ]
          started = datetime.now(timezone.utc)
          monotonic_start = time.monotonic()
          process = None
          sampler_exit = None
          timed_out = False
          drained = False
          sanitize_error = None

          def sanitize_speedscope(document):
              frames = document.get("shared", {}).get("frames")
              profiles = document.get("profiles")
              if not isinstance(frames, list) or not isinstance(profiles, list):
                  raise ValueError("unrecognized speedscope structure")
              for frame in frames:
                  name = frame.get("name") if isinstance(frame, dict) else None
                  if not isinstance(name, str):
                      raise ValueError("unrecognized speedscope frame")
                  match = re.fullmatch(r"process ([0-9]+):.*", name, flags=re.DOTALL)
                  if match:
                      frame["name"] = f"process {match.group(1)}"
                      continue
                  match = re.fullmatch(r"thread \(([0-9]+)\):.*", name, flags=re.DOTALL)
                  if match:
                      frame["name"] = f"thread ({match.group(1)})"
              for profile_item in profiles:
                  name = profile_item.get("name") if isinstance(profile_item, dict) else None
                  match = re.fullmatch(
                      r"Process ([0-9]+) Thread ([0-9]+)(?: .*)?", name, flags=re.DOTALL
                  ) if isinstance(name, str) else None
                  if not match:
                      raise ValueError("unrecognized speedscope profile label")
                  profile_item["name"] = f"Process {match.group(1)} Thread {match.group(2)}"
              return document

          def group_has_live_process(pgid):
              for stat_path in Path("/proc").glob("[0-9]*/stat"):
                  try:
                      stat = stat_path.read_text()
                      fields = stat[stat.rfind(")") + 2:].split()
                      if int(fields[2]) == pgid and fields[0] != "Z":
                          return True
                  except (OSError, ValueError, IndexError):
                      continue
              return False

          def drain_group(pgid):
              for sig, delay in ((signal.SIGTERM, 1), (signal.SIGKILL, 1)):
                  if not group_has_live_process(pgid):
                      return True
                  try:
                      os.killpg(pgid, sig)
                  except ProcessLookupError:
                      return True
                  time.sleep(delay)
              return not group_has_live_process(pgid)

          try:
              process = subprocess.Popen(sampler_command, start_new_session=True)
              try:
                  sampler_exit = process.wait(timeout=1800)
              except subprocess.TimeoutExpired:
                  timed_out = True
                  os.kill(process.pid, signal.SIGINT)
                  try:
                      sampler_exit = process.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      drain_group(process.pid)
                      sampler_exit = process.wait(timeout=5)
          finally:
              if process is not None:
                  drained = drain_group(process.pid)
              try:
                  if raw_profile.is_file():
                      sanitized = sanitize_speedscope(json.loads(raw_profile.read_text(encoding="utf-8")))
                      profile.write_text(json.dumps(sanitized), encoding="utf-8")
              except (OSError, ValueError, TypeError, json.JSONDecodeError) as exc:
                  sanitize_error = type(exc).__name__
              finally:
                  raw_profile.unlink(missing_ok=True)
              ended = datetime.now(timezone.utc)
              pytest_status = json.loads(status_path.read_text()) if status_path.is_file() else None
              metadata = {
                  "sampler": subprocess.run(
                      [os.path.join(os.environ["RUNNER_TEMP"], "py-spy-venv", "bin", "py-spy"), "--version"],
                      capture_output=True, text=True,
                  ).stdout.strip(),
                  "python": sys.version,
                  "pytest_command": pytest_command,
                  "sampler_command": sampler_command,
                  "started_utc": started.isoformat(),
                  "ended_utc": ended.isoformat(),
                  "elapsed_seconds": time.monotonic() - monotonic_start,
                  "sampler_exit": sampler_exit,
                  "pytest_status": pytest_status,
                  "watchdog_timed_out": timed_out,
                  "owned_process_group_drained": drained,
                  "sanitizer_error": sanitize_error,
                  "profile_bytes": profile.stat().st_size if profile.is_file() else 0,
                  "profile_sha256": hashlib.sha256(profile.read_bytes()).hexdigest() if profile.is_file() else None,
              }
              (capture_dir / "capture.json").write_text(json.dumps(metadata, indent=2) + "\n", encoding="utf-8")

          if (sampler_exit != 0 or pytest_status is None or pytest_status.get("pytest_exit") != 0
                  or timed_out or not drained or sanitize_error is not None or metadata["profile_bytes"] == 0):
              raise SystemExit(1)
          PY

      - name: Preserve Linux stack capture
        if: always() && github.event_name == 'workflow_dispatch' && inputs.profile_linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-python-stacks-${{ matrix.python-version }}
          path: ${{ runner.temp }}/linux-python-stacks/
          if-no-files-found: warn
          retention-days: 3

  # Fast Windows regression for full-lane PRs and pushes. Runs only the
  # Windows-sensitive hotspots (process mgmt, subprocess hooks, file I/O,
  # SQLite locking) so PRs get Windows signal without the ~20 min full suite.
  # The full Windows matrix runs in `windows-full` on push-to-main + nightly.
  windows-smoke:
    needs: select
    if: needs.select.outputs.lane == 'full'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Exclude workspace from Windows Defender
        shell: pwsh
        run: |
          foreach ($path in @("${{ github.workspace }}", "$env:RUNNER_TEMP")) {
            try {
              Add-MpPreference -ExclusionPath $path -ErrorAction Stop
              Write-Host "Defender exclusion added: $path"
            } catch {
              Write-Host "::warning::Could not add Defender exclusion for ${path}: $($_.Exception.Message)"
            }
          }

      - name: Install dependencies
        run: pip install -e ".[dev,vector,mcp]"

      - name: Run process-sensitive tests serially
        run: python -m pytest tests/test_service_launcher_lifecycle.py tests/test_service.py::test_windows_stop_verifier_executes_new_and_legacy_launcher_parsers tests/test_codex_retained_wake.py::test_session_start_lock_budget_claims_emits_and_acks_once -x -q -n 0 --durations=20

      - name: Run Windows-sensitive tests
        run: >
          python -m pytest -x -q --durations=20
          tests/test_supervisor.py
          tests/test_supervisor_kill_tree.py
          tests/test_codex_integration.py
          tests/test_restart_service.py
          tests/test_hook_deadline_safety.py
          tests/test_asyncio_windows_accept.py
          tests/test_claude_code_hooks
          tests/test_snapshot.py
          tests/test_snapshot_concurrent.py
          tests/test_snapshot_failure.py
          tests/test_snapshot_roundtrip.py
          tests/test_storage_sqlite.py
          tests/test_sqlite_write_retry.py
          tests/test_relay_endpoint_repair_e2e.py
          tests/test_queue_concurrent_claim.py
          tests/test_launch_token.py
          tests/test_config.py
          tests/test_runtime_logging.py

  # Full Windows matrix for full-lane pushes, nightly and manual runs, never on PRs.
  windows-full:
    needs: select
    if: needs.select.outputs.lane == 'full' && github.event_name != 'pull_request'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Exclude workspace from Windows Defender
        shell: pwsh
        run: |
          foreach ($path in @("${{ github.workspace }}", "$env:RUNNER_TEMP")) {
            try {
              Add-MpPreference -ExclusionPath $path -ErrorAction Stop
              Write-Host "Defender exclusion added: $path"
            } catch {
              Write-Host "::warning::Could not add Defender exclusion for ${path}: $($_.Exception.Message)"
            }
          }

      - name: Install dependencies
        run: pip install -e ".[dev,vector,mcp]"

      - name: Run process-sensitive tests serially
        run: python -m pytest tests/test_restart_service.py tests/test_structural_work_refs_e2e.py tests/test_stable_actor_identity_e2e.py tests/test_service_launcher_lifecycle.py tests/test_service.py::test_windows_stop_verifier_executes_new_and_legacy_launcher_parsers tests/test_codex_retained_wake.py::test_session_start_lock_budget_claims_emits_and_acks_once -x -q -n 0 --durations=20

      - name: Run remaining tests
        run: python -m pytest tests/ -x -q --ignore=tests/test_restart_service.py --ignore=tests/test_structural_work_refs_e2e.py --ignore=tests/test_stable_actor_identity_e2e.py --ignore=tests/test_service_launcher_lifecycle.py --deselect=tests/test_service.py::test_windows_stop_verifier_executes_new_and_legacy_launcher_parsers --deselect=tests/test_codex_retained_wake.py::test_session_start_lock_budget_claims_emits_and_acks_once --durations=20

  nightly-slow-smoke:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev,vector,mcp]"

      - name: Run hermetic slow smoke tests
        run: >
          python -m pytest
          tests/test_snapshot.py
          tests/test_snapshot_concurrent.py
          tests/test_snapshot_failure.py
          tests/test_storage_sqlite.py
          tests/test_thread_summary_accumulation.py
          tests/test_relay_load_smoke.py
          -m slow -n 0 -q --durations=20

  result:
    name: CI result
    needs: [select, focused, test, windows-smoke, windows-full, nightly-slow-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected lane to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          jobs = json.loads(os.environ["RESULTS"])
          selection = jobs["select"]
          assert selection["result"] == "success", "test selection did not succeed"
          outputs = selection.get("outputs", {})
          assert outputs.get("selector_error") == "false", "trusted selector failed; full validation was requested"
          lane = outputs.get("lane")
          assert lane in {"docs", "governance", "full"}, "missing or invalid lane"
          event = os.environ["EVENT"]
          assert event not in {"schedule", "workflow_dispatch"} or lane == "full", "scheduled/manual runs must be full"
          expected = {
              "focused": lane != "full",
              "test": lane == "full",
              "windows-smoke": lane == "full",
              "windows-full": lane == "full" and event != "pull_request",
              "nightly-slow-smoke": event == "schedule",
          }
          for job, required in expected.items():
              wanted = "success" if required else "skipped"
              assert jobs[job]["result"] == wanted, f"{job}: expected {wanted}, got {jobs[job]['result']}"
          print(f"All required {lane} checks succeeded")
          PY
