name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquisition-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DIAGNOSTICS_SHA: ${{ github.sha }}
    steps:
      - name: Start bounded diagnostic clock
        run: |
          echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          echo "PALLIUM_DIAGNOSTIC_OUTPUT=$RUNNER_TEMP/pr297-evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: 07697ac2b8f74e8503534a6586fb13dbb30bdeb4
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.16"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Extract and verify separately reviewed diagnostics
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          sha = os.environ["DIAGNOSTICS_SHA"]
          assert re.fullmatch(r"[0-9a-f]{40}", sha)
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "pr297-diagnostic"
          root.mkdir()
          prefix = ".diagnostics/pr297/"
          def blob(path):
              return subprocess.check_output(["git", "show", sha + ":" + path])
          manifest = json.loads(blob(prefix + "manifest.json"))
          paths = ["acquisition_observer.py", "run.py", "guard/sitecustomize.py"]
          assert set(manifest["sha256"]) == set(paths + [".github/workflows/ci.yml"])
          for name in paths:
              data = blob(prefix + name)
              assert hashlib.sha256(data).hexdigest() == manifest["sha256"][name], name
              destination = root / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
          controller = blob(".github/workflows/ci.yml")
          assert hashlib.sha256(controller).hexdigest() == manifest["sha256"][".github/workflows/ci.yml"]
          output = pathlib.Path(os.environ["PALLIUM_DIAGNOSTIC_OUTPUT"])
          output.mkdir()
          (output / "admission.json").write_text(json.dumps(dict(
              diagnostic_sha=sha, product_sha=subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              run_id=os.environ["GITHUB_RUN_ID"], attempt=os.environ["GITHUB_RUN_ATTEMPT"], manifest=manifest), indent=2))
          PY
      - name: Install unchanged product dependencies
        timeout-minutes: 5
        run: pip install -e ".[dev,vector,mcp]"
      - name: Verify MCP test dependency
        run: python -c "import mcp; import app.mcp.server"
      - name: Observe unchanged full non-slow suite once
        run: python "$RUNNER_TEMP/pr297-diagnostic/run.py"
      - name: Preserve complete or partial diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr297-linux313-acquisition-${{ github.run_id }}
          path: ${{ runner.temp }}/pr297-evidence
          if-no-files-found: error
          retention-days: 14
