name: PR312 native cause diagnostic (not release qualification)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly full run (incl. the full Windows matrix). Off-peak, off :00.
    - cron: "17 6 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.plan.outputs.lane }}
      selector_error: ${{ steps.plan.outputs.selector_error }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Select checks from trusted base policy
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          lane=full
          selector_error=false
          if [[ "$EVENT" != schedule && "$EVENT" != workflow_dispatch ]]; then
            trusted="$BASE"
            if [[ "$EVENT" == pull_request ]]; then
              trusted=$(git merge-base "$BASE" "$HEAD") || trusted=""
            fi
            # Missing history/policy (including rollout) safely keeps the full lane.
            if [[ -n "$trusted" ]] && git show "$trusted:scripts/test-plan.py" > "$RUNNER_TEMP/trusted-test-plan.py"; then
              if python "$RUNNER_TEMP/trusted-test-plan.py" --repo-root "$GITHUB_WORKSPACE" --base "$trusted" --head "$HEAD" --exact > "$RUNNER_TEMP/test-plan.json"; then
                if ! lane=$(python -c 'import json,sys; p=json.load(open(sys.argv[1])); lane=p["lane"]; assert lane in ("docs","governance","full"); print(lane)' "$RUNNER_TEMP/test-plan.json"); then
                  lane=full
                  selector_error=true
                fi
              else
                lane=full
                selector_error=true
              fi
            fi
          fi
          echo "lane=$lane" >> "$GITHUB_OUTPUT"
          echo "selector_error=$selector_error" >> "$GITHUB_OUTPUT"
          echo "Validation lane: $lane; selector error: $selector_error" >> "$GITHUB_STEP_SUMMARY"

  focused:
    needs: select
    if: needs.select.outputs.lane == 'docs' || needs.select.outputs.lane == 'governance'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.select.outputs.lane == 'governance' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install focused test dependencies
        run: pip install "pytest>=8.3,<9" "pytest-xdist>=3.6,<4" pyyaml jsonschema
      - name: Check documentation and selection contracts
        if: needs.select.outputs.lane == 'docs'
        run: python -m pytest --noconftest -q -n 0 tests/test_test_plan.py tests/test_ci_workflow.py --durations=20
      - name: Check governance caller contracts
        if: needs.select.outputs.lane == 'governance'
        run: python -m pytest --noconftest -q -n 0 tests/test_test_plan.py tests/test_ci_workflow.py tests/test_agent_workflow_ci.py --durations=20

  # Full application coverage for application/unknown changes and scheduled/manual runs.
  test:
    needs: select
    if: needs.select.outputs.lane == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12.15"]
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/.github/ci/pr312-native-linux312-constraints.txt
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Prepare native cause receipts
        shell: pwsh
        env:
          PALLIUM_PR312_NATIVE_CAUSE_DIR: ${{ runner.temp }}/pr312-native-cause
        run: |
          "PALLIUM_PR312_NATIVE_CAUSE_DIR=$env:PALLIUM_PR312_NATIVE_CAUSE_DIR" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Path $env:PALLIUM_PR312_NATIVE_CAUSE_DIR -Force | Out-Null
          foreach ($operation in @("initialize", "reserve")) {
            '{"preparation":"ready","target_state":"not_started","outcome":null}' | Set-Content -LiteralPath (Join-Path $env:PALLIUM_PR312_NATIVE_CAUSE_DIR "$operation.json") -Encoding utf8
          }

      - name: Install dependencies
        run: pip install -e ".[dev,vector,mcp]"

      - name: Verify MCP test dependency
        run: python -c "import mcp; import app.mcp.server"

      - name: Record installed distributions
        run: python -c "import importlib.metadata as m; print('\n'.join(sorted(d.metadata['Name']+'=='+d.version for d in m.distributions() if d.metadata['Name'].lower().replace('_','-')!='pallium')))" > "${{ runner.temp }}/pr312-native-cause/installed.txt"

      - name: Record Python and SQLite versions
        run: python -c "import json,sys,sqlite3; print(json.dumps({'python':sys.version.split()[0],'sqlite':sqlite3.sqlite_version}))" > "${{ runner.temp }}/pr312-native-cause/runtime.json"

      - name: Run tests
        id: remaining_tests
        timeout-minutes: 45
        run: python -m pytest tests/ -q -n 4 --durations=20 --junitxml "${{ runner.temp }}/pr312-native-cause/junit.xml"

      - name: Record native cause completion
        if: always()
        shell: pwsh
        env:
          REMAINING_OUTCOME: ${{ steps.remaining_tests.outcome }}
        run: |
          $receipt = Join-Path $env:PALLIUM_PR312_NATIVE_CAUSE_DIR "initialize.json"
          try { $data = Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json } catch {
            $data = [pscustomobject]@{ preparation = "unknown"; target_state = "incomplete"; outcome = $null }
          }
          $boundedLoss = $data.dropped_errors -gt 0 -or @($data.errors | Where-Object { $_.chain_truncated -eq $true }).Count -gt 0
          $missing = @("outcome", "outcome_scope", "operation", "started", "returned", "failed", "errors", "dropped_errors") | Where-Object { $_ -notin $data.psobject.Properties.Name }
          $complete = @($missing).Count -eq 0 -and $data.target_state -eq "completed" -and $data.outcome -in @("passed", "failed") -and $data.outcome_scope -eq "test_body_before_fixture_teardown" -and $data.operation -eq "initialize" -and $data.started -gt 0 -and $data.started -eq $data.returned + $data.failed -and $data.failed -eq @($data.errors).Count + $data.dropped_errors -and -not $boundedLoss
          $data | Add-Member -Force -NotePropertyName capture_complete -NotePropertyValue $complete
          $data | Add-Member -Force -NotePropertyName bounded_loss -NotePropertyValue $boundedLoss
          $data | Add-Member -Force -NotePropertyName junit_present -NotePropertyValue (Test-Path -LiteralPath (Join-Path $env:PALLIUM_PR312_NATIVE_CAUSE_DIR "junit.xml"))
          $data | Add-Member -Force -NotePropertyName remaining_suite -NotePropertyValue $env:REMAINING_OUTCOME
          $data | ConvertTo-Json -Depth 16 | Set-Content -LiteralPath $receipt -Encoding utf8

      - name: Upload native cause evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr312-native-cause-linux-${{ matrix.python-version }}
          path: ${{ runner.temp }}/pr312-native-cause/
          if-no-files-found: error
          retention-days: 7

      - name: Require complete native cause capture
        if: always()
        shell: pwsh
        run: |
          $data = Get-Content -LiteralPath (Join-Path $env:PALLIUM_PR312_NATIVE_CAUSE_DIR "initialize.json") -Raw | ConvertFrom-Json
          if ($data.capture_complete -ne $true -or $data.junit_present -ne $true) { throw "Native cause capture incomplete" }

  # Fast Windows regression for full-lane PRs and pushes. Runs only the
  # Windows-sensitive hotspots (process mgmt, subprocess hooks, file I/O,
  # SQLite locking) so PRs get Windows signal without the ~20 min full suite.
  # The full Windows matrix runs in `windows-full` on push-to-main + nightly.
  windows-smoke:
    needs: select
    if: needs.select.outputs.lane == 'full' && false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Exclude workspace from Windows Defender
        shell: pwsh
        run: |
          foreach ($path in @("${{ github.workspace }}", "$env:RUNNER_TEMP")) {
            try {
              Add-MpPreference -ExclusionPath $path -ErrorAction Stop
              Write-Host "Defender exclusion added: $path"
            } catch {
              Write-Host "::warning::Could not add Defender exclusion for ${path}: $($_.Exception.Message)"
            }
          }

      - name: Install dependencies
        run: pip install -e ".[dev,vector,mcp]"

      - name: Run process-sensitive tests serially
        run: python -m pytest tests/test_service_launcher_lifecycle.py tests/test_service.py::test_windows_stop_verifier_executes_new_and_legacy_launcher_parsers tests/test_codex_retained_wake.py::test_session_start_lock_budget_claims_emits_and_acks_once -x -q -n 0 --durations=20

      - name: Run Windows-sensitive tests
        run: >
          python -m pytest -x -q --durations=20
          tests/test_supervisor.py
          tests/test_supervisor_kill_tree.py
          tests/test_codex_integration.py
          tests/test_restart_service.py
          tests/test_hook_deadline_safety.py
          tests/test_asyncio_windows_accept.py
          tests/test_claude_code_hooks
          tests/test_snapshot.py
          tests/test_snapshot_concurrent.py
          tests/test_snapshot_failure.py
          tests/test_snapshot_roundtrip.py
          tests/test_storage_sqlite.py
          tests/test_sqlite_write_retry.py
          tests/test_relay_endpoint_repair_e2e.py
          tests/test_queue_concurrent_claim.py
          tests/test_launch_token.py
          tests/test_config.py
          tests/test_runtime_logging.py

  # Full Windows matrix for full-lane pushes, nightly and manual runs, never on PRs.
  windows-full:
    needs: select
    if: needs.select.outputs.lane == 'full' && github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12.10"]
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/.github/ci/pr312-native-windows312-constraints.txt
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Exclude workspace from Windows Defender
        shell: pwsh
        run: |
          foreach ($path in @("${{ github.workspace }}", "$env:RUNNER_TEMP")) {
            try {
              Add-MpPreference -ExclusionPath $path -ErrorAction Stop
              Write-Host "Defender exclusion added: $path"
            } catch {
              Write-Host "::warning::Could not add Defender exclusion for ${path}: $($_.Exception.Message)"
            }
          }

      - name: Prepare native cause receipts
        shell: pwsh
        env:
          PALLIUM_PR312_NATIVE_CAUSE_DIR: ${{ runner.temp }}/pr312-native-cause
        run: |
          "PALLIUM_PR312_NATIVE_CAUSE_DIR=$env:PALLIUM_PR312_NATIVE_CAUSE_DIR" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Path $env:PALLIUM_PR312_NATIVE_CAUSE_DIR -Force | Out-Null
          foreach ($operation in @("initialize", "reserve")) {
            '{"preparation":"ready","target_state":"not_started","outcome":null}' | Set-Content -LiteralPath (Join-Path $env:PALLIUM_PR312_NATIVE_CAUSE_DIR "$operation.json") -Encoding utf8
          }

      - name: Install dependencies
        id: install_dependencies
        run: pip install -e ".[dev,vector,mcp]"

      - name: Record installed distributions
        run: python -c "import importlib.metadata as m; print('\n'.join(sorted(d.metadata['Name']+'=='+d.version for d in m.distributions() if d.metadata['Name'].lower().replace('_','-')!='pallium')))" > "${{ runner.temp }}/pr312-native-cause/installed.txt"

      - name: Record Python and SQLite versions
        run: python -c "import json,sys,sqlite3; print(json.dumps({'python':sys.version.split()[0],'sqlite':sqlite3.sqlite_version}))" > "${{ runner.temp }}/pr312-native-cause/runtime.json"

      - name: Run process-sensitive tests serially
        id: serial_tests
        continue-on-error: true
        run: python -m pytest tests/test_restart_service.py tests/test_structural_work_refs_e2e.py tests/test_stable_actor_identity_e2e.py tests/test_service_launcher_lifecycle.py tests/test_service.py::test_windows_stop_verifier_executes_new_and_legacy_launcher_parsers tests/test_codex_retained_wake.py::test_session_start_lock_budget_claims_emits_and_acks_once -x -q -n 0 --durations=20

      - name: Run remaining tests
        id: remaining_tests
        timeout-minutes: 45
        if: ${{ !cancelled() && steps.install_dependencies.outcome == 'success' }}
        run: python -m pytest tests/ -q -n 4 --ignore=tests/test_restart_service.py --ignore=tests/test_structural_work_refs_e2e.py --ignore=tests/test_stable_actor_identity_e2e.py --ignore=tests/test_service_launcher_lifecycle.py --deselect=tests/test_service.py::test_windows_stop_verifier_executes_new_and_legacy_launcher_parsers --deselect=tests/test_codex_retained_wake.py::test_session_start_lock_budget_claims_emits_and_acks_once --durations=20 --junitxml "${{ runner.temp }}/pr312-native-cause/junit.xml"

      - name: Record native cause completion
        if: always()
        shell: pwsh
        env:
          SERIAL_OUTCOME: ${{ steps.serial_tests.outcome }}
          REMAINING_OUTCOME: ${{ steps.remaining_tests.outcome }}
        run: |
          $receipt = Join-Path $env:PALLIUM_PR312_NATIVE_CAUSE_DIR "reserve.json"
          try { $data = Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json } catch {
            $data = [pscustomobject]@{ preparation = "unknown"; target_state = "incomplete"; outcome = $null }
          }
          $boundedLoss = $data.dropped_errors -gt 0 -or @($data.errors | Where-Object { $_.chain_truncated -eq $true }).Count -gt 0
          $missing = @("outcome", "outcome_scope", "operation", "started", "returned", "failed", "errors", "dropped_errors") | Where-Object { $_ -notin $data.psobject.Properties.Name }
          $complete = @($missing).Count -eq 0 -and $data.target_state -eq "completed" -and $data.outcome -in @("passed", "failed") -and $data.outcome_scope -eq "test_body_before_fixture_teardown" -and $data.operation -eq "reserve" -and $data.started -gt 0 -and $data.started -eq $data.returned + $data.failed -and $data.failed -eq @($data.errors).Count + $data.dropped_errors -and -not $boundedLoss
          $data | Add-Member -Force -NotePropertyName capture_complete -NotePropertyValue $complete
          $data | Add-Member -Force -NotePropertyName bounded_loss -NotePropertyValue $boundedLoss
          $data | Add-Member -Force -NotePropertyName junit_present -NotePropertyValue (Test-Path -LiteralPath (Join-Path $env:PALLIUM_PR312_NATIVE_CAUSE_DIR "junit.xml"))
          $data | Add-Member -Force -NotePropertyName serial_preflight -NotePropertyValue $env:SERIAL_OUTCOME
          $data | Add-Member -Force -NotePropertyName remaining_suite -NotePropertyValue $env:REMAINING_OUTCOME
          $data | ConvertTo-Json -Depth 16 | Set-Content -LiteralPath $receipt -Encoding utf8

      - name: Upload native cause evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr312-native-cause-windows-${{ matrix.python-version }}
          path: ${{ runner.temp }}/pr312-native-cause/
          if-no-files-found: error
          retention-days: 7

      - name: Preserve diagnostic test failures
        if: always()
        shell: pwsh
        env:
          SERIAL_OUTCOME: ${{ steps.serial_tests.outcome }}
          REMAINING_OUTCOME: ${{ steps.remaining_tests.outcome }}
        run: |
          if ($env:SERIAL_OUTCOME -ne "success" -or $env:REMAINING_OUTCOME -ne "success") {
            throw "Diagnostic test failure: serial=$env:SERIAL_OUTCOME remaining=$env:REMAINING_OUTCOME"
          }
          $data = Get-Content -LiteralPath (Join-Path $env:PALLIUM_PR312_NATIVE_CAUSE_DIR "reserve.json") -Raw | ConvertFrom-Json
          if ($data.capture_complete -ne $true -or $data.junit_present -ne $true) { throw "Native cause capture incomplete" }

  nightly-slow-smoke:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev,vector,mcp]"

      - name: Run hermetic slow smoke tests
        run: >
          python -m pytest
          tests/test_snapshot.py
          tests/test_snapshot_concurrent.py
          tests/test_snapshot_failure.py
          tests/test_storage_sqlite.py
          tests/test_thread_summary_accumulation.py
          tests/test_relay_load_smoke.py
          -m slow -n 0 -q --durations=20

  result:
    name: CI result
    needs: [select, focused, test, windows-smoke, windows-full, nightly-slow-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected lane to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          PR312_NATIVE_CAUSE_DIAGNOSTIC: "true"
        run: |
          python - <<'PY'
          import json, os
          jobs = json.loads(os.environ["RESULTS"])
          selection = jobs["select"]
          assert selection["result"] == "success", "test selection did not succeed"
          outputs = selection.get("outputs", {})
          assert outputs.get("selector_error") == "false", "trusted selector failed; full validation was requested"
          lane = outputs.get("lane")
          assert lane in {"docs", "governance", "full"}, "missing or invalid lane"
          event = os.environ["EVENT"]
          assert event not in {"schedule", "workflow_dispatch"} or lane == "full", "scheduled/manual runs must be full"
          diagnostic = os.environ.get("PR312_NATIVE_CAUSE_DIAGNOSTIC") == "true"
          expected = {
              "focused": lane != "full",
              "test": lane == "full",
              "windows-smoke": lane == "full" and not diagnostic,
              "windows-full": lane == "full" and event != "pull_request",
              "nightly-slow-smoke": event == "schedule",
          }
          for job, required in expected.items():
              wanted = "success" if required else "skipped"
              assert jobs[job]["result"] == wanted, f"{job}: expected {wanted}, got {jobs[job]['result']}"
          print(f"All required {lane} checks succeeded")
          PY
