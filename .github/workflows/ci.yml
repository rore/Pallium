name: Bounded native gate capture
run-name: Native gate ${{ inputs.ticket }}

on:
  workflow_dispatch:
    inputs:
      ticket:
        description: Random 32-hex correlation ticket from the bounded owner entry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bounded-native-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_INPUT: '1'
      PIP_RETRIES: '0'
      PIP_RESUME_RETRIES: '0'
      TICKET: ${{ inputs.ticket }}
    steps:
      - name: Check out exact definition
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: definition
      - name: Check out immutable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5e526641db27a5a91655164ccbf7194f097cdaba
          persist-credentials: false
          path: source
      - name: Select exact interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.17'
          architecture: x64
          cache: false
      - name: One bounded isolated setup attempt
        shell: bash
        env:
          SOURCE_ROOT: ${{ github.workspace }}/source
          VENV: ${{ runner.temp }}/capture-venv
          GATE_ENV_ROOT: ${{ runner.temp }}/capture-venv
          DEFINITION: ${{ github.workspace }}/definition
        run: |
          set -euo pipefail
          [[ "$TICKET" =~ ^[0-9a-f]{32}$ ]] || { echo 'invalid_ticket'; exit 1; }
          mkdir -p "$RUNNER_TEMP/capture-entry"
          if ! (
            cd "$DEFINITION" || exit 1
            printf "%s  %s\n" \
              39a05c071a5226cebe579f2caef2e50bcab6de6e4ef039fc64fc8464f76dece5 .github/diagnostics/gate_capture.py \
              6f3b3e7fb7f0b4f47ab2cb36aaa64cad6169528bc4982f19ec47e2c1524e80a5 .github/diagnostics/constraints.txt | sha256sum --check --strict || exit 1
            python -I -S -B .github/diagnostics/gate_capture.py setup \
              --source "$SOURCE_ROOT" --environment "$VENV" \
              --constraints "$DEFINITION/.github/diagnostics/constraints.txt" \
              --scratch "$RUNNER_TEMP/capture-setup"
          ) > "$RUNNER_TEMP/capture-entry/setup.private.log" 2>&1; then
            echo 'setup_failed_no_retry'
            exit 1
          fi
      - name: Controls then one conditionally admitted subject
        id: capture
        shell: bash
        env:
          GATE_ENV_ROOT: ${{ runner.temp }}/capture-venv
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/capture-entry"
          status=0
          "$RUNNER_TEMP/capture-venv/bin/python" -B \
            "$GITHUB_WORKSPACE/definition/.github/diagnostics/gate_capture.py" job \
            --source "$GITHUB_WORKSPACE/source" \
            --out "$RUNNER_TEMP/capture-evidence" \
            --constraints "$GITHUB_WORKSPACE/definition/.github/diagnostics/constraints.txt" \
            > "$RUNNER_TEMP/capture-entry/job.private.log" 2>&1 || status=$?
          if (( status != 0 )); then
            echo 'capture_failed_private_details'
            exit 1
          fi
          echo 'capture_completed'
      - name: Upload only validated allowlisted evidence
        if: always() && steps.capture.outputs.safe_upload == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bounded-native-gate-evidence
          path: ${{ runner.temp }}/capture-evidence/public/evidence.json
          if-no-files-found: error
          retention-days: 1
