name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Windows Defender real-time scanning of the per-test SQLite temp files
      # (a fresh DB is created in tmp_path for nearly every test) is the
      # dominant cost of the Windows job — ~10 min vs ~2 min on Ubuntu.
      # Excluding the workspace and runner temp dirs removes that overhead.
      # Non-fatal: if the cmdlet is unavailable the job still proceeds.
      - name: Exclude workspace from Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction Stop
            Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP" -ErrorAction Stop
            Write-Host "Defender exclusions added for workspace and RUNNER_TEMP."
          } catch {
            Write-Host "::warning::Could not add Defender exclusion: $($_.Exception.Message)"
          }

      - name: Install dependencies
        run: pip install -e ".[dev,vector]"

      - name: Run tests
        run: python -m pytest tests/ -x -q
