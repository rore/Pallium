name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-boundary-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DIAGNOSTICS_SHA: ${{ github.sha }}
    steps:
      - name: Start bounded diagnostic clock
        run: |
          echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          echo "PALLIUM_DIAGNOSTIC_OUTPUT=$RUNNER_TEMP/pr297-evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: 07697ac2b8f74e8503534a6586fb13dbb30bdeb4
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.16"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Extract exactly frozen reviewed diagnostics
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          sha = os.environ["DIAGNOSTICS_SHA"]
          assert re.fullmatch(r"[0-9a-f]{40}", sha)
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "pr297-native"
          root.mkdir()
          prefix = ".diagnostics/pr297-native/"
          def blob(path):
              return subprocess.check_output(["git", "show", sha + ":" + path])
          raw_manifest = blob(prefix + "manifest.json")
          assert hashlib.sha256(raw_manifest).hexdigest() == "48b2da8a77bb922dc7c0d5fb94d619e7da32623e2ab6b376bcb71c99ace5c164"
          manifest = json.loads(raw_manifest)
          paths = ["launch.py", "restore-context.py", "native-controller.py", "native-preflight.py", "native.bt.in", "probe-map.json", "qualification.py", "acquisition_observer.py", "guard/sitecustomize.py"]
          assert set(manifest["sha256"]) == set(paths)
          for name in paths:
              data = blob(prefix + name)
              assert hashlib.sha256(data).hexdigest() == manifest["sha256"][name], name
              destination = root / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
          (root / "manifest.json").write_bytes(raw_manifest)
          product = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert product == manifest["product"] == "07697ac2b8f74e8503534a6586fb13dbb30bdeb4"
          assert os.environ["GITHUB_RUN_ATTEMPT"] == "1"
          (pathlib.Path(os.environ["RUNNER_TEMP"]) / "pr297-admission.json").write_text(json.dumps(dict(
              diagnostic_sha=sha, product_sha=product, run_id=os.environ["GITHUB_RUN_ID"],
              attempt=os.environ["GITHUB_RUN_ATTEMPT"], manifest=manifest), indent=2))
          PY
      - name: Install unchanged product dependencies
        timeout-minutes: 5
        run: pip install -e ".[dev,vector,mcp]"
      - name: Verify unchanged MCP test dependency
        run: python -c "import mcp; import app.mcp.server"
      - name: Preflight then observe unchanged full non-slow suite once
        run: python "$RUNNER_TEMP/pr297-native/launch.py"
      - name: Preserve complete or partial diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr297-linux313-native-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pr297-evidence
            ${{ runner.temp }}/pr297-admission.json
          if-no-files-found: error
          retention-days: 14
