name: agent-redline

# Push-driven flow: this repo's actual workflow is direct-to-main (141
# commits / 30 days, 2 PRs total). PR-shaped governance would only fire
# on ~1.4% of changes, which would mean ~0% governance coverage. The
# push-driven shape gives every push to main a verdict. Tuner output
# (--push-history --branch main --limit 30) confirms every red rule
# fires below 15% — alert-fatigue risk is low.
#
# Trade-off: no PR comment surface. The verdict goes to the workflow
# log + an `agent-redline-verdict` artifact. The "Enforce" step fails
# CI on exit 1 OR exit 2 (not just exit 2 like the PR-driven shape) —
# without a sticky comment, CI red is the only visibility channel for
# warnings. See agent-redline skill's extensions/python/scaffold.md
# §5b for the canonical pattern this implements.
#
# Boundary job stays with continue-on-error: true through the shadow
# window. After flipping agent-policy.yaml's modes.default to binding,
# drop both this and the boundary's continue-on-error together.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  boundary:
    name: Boundary check (import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Run import-linter via adapter
        run: |
          mkdir -p build
          python scripts/run-import-linter.py --out build/import-linter-report.json
        # Exits 1 on violations; reporter step surfaces them through its
        # boundaryAdapter dispatch. Drop this once the shadow window is done.
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: boundary-report
          path: build/import-linter-report.json
          if-no-files-found: error

  report:
    name: agent-redline report
    needs: boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: boundary-report
          path: build/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema

      - name: Run reporter
        id: report
        # Same exit-code contract as PR mode (0/1/2):
        #   0  clean (BLUE / no checkpoints / contracts pass)
        #   1  warnings (gray-zone / unmet checkpoint in shadow / watch
        #      touched / pr-size warn) — fails CI in push mode (see
        #      Enforce step below) because there is no PR comment surface.
        #   2  binding-mode hard fail — always fails CI.
        #
        # Push-mode-specific: BEFORE/AFTER diff handles "first push to a
        # branch" (BEFORE is all-zeros) and force-push (BEFORE may be a
        # SHA the runner doesn't have) by falling back to merge-base
        # against the default branch. set +e so the sticky-style steps
        # (artifact upload, enforce) still run on non-zero reporter exit.
        run: |
          set +e
          mkdir -p build
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" || -z "$BEFORE" ]] || \
             ! git rev-parse --verify "$BEFORE^{commit}" >/dev/null 2>&1; then
            BEFORE="$(git merge-base origin/main "$AFTER" 2>/dev/null || echo "$AFTER^")"
          fi
          git diff --name-only "$BEFORE"..."$AFTER" > build/changed-files.txt
          LINES_CHANGED=$(git diff --shortstat "$BEFORE"..."$AFTER" \
            | awk '{for (i=1;i<=NF;i++) if ($i ~ /insertions?|deletions?/) s+=$(i-1)} END{print s+0}')
          python scripts/agent-redline-report.py \
            --policy agent-policy.yaml \
            --changed-files build/changed-files.txt \
            --lines-changed "${LINES_CHANGED:-0}" \
            --json-out build/verdict.json \
            --comment-out build/comment.md
          EXIT=$?
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          echo "--- verdict.json ---" && cat build/verdict.json
          echo "--- comment.md ---" && cat build/comment.md
          echo "reporter exit code: $EXIT"

      - name: Upload verdict artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-redline-verdict
          path: |
            build/verdict.json
            build/comment.md

      - name: Enforce reporter exit code
        # Push-mode default: fail CI on exit 1 OR 2. Without a PR comment,
        # CI red is the only surface for exit-1 warnings — silencing them
        # silences shadow-mode signal entirely.
        run: |
          EXIT="${{ steps.report.outputs.exit_code }}"
          if [[ "$EXIT" != "0" ]]; then
            echo "Reporter exited $EXIT. Failing the check."
            echo "See the agent-redline-verdict artifact for the verdict."
            exit 1
          fi
          echo "Reporter exited 0 — clean."
