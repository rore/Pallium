name: agent-redline

# Soft-launch configuration:
# - boundary job runs import-linter with continue-on-error so violations
#   surface but don't fail the PR yet.
# - report job posts a sticky PR comment regardless of verdict and uses
#   the reporter's exit code to decide whether to fail the check
#   (exit 0 = clean, exit 1 = warnings/non-blocking, exit 2 = binding-
#   mode hard fail). With agent-policy.yaml's modes.default = shadow,
#   the reporter only emits exit 2 for boundary_violation (per the
#   policy's modes.perCheck override), so the report job stays green
#   for everything else and gives a sticky-comment verdict.
#
# After ~30 PRs or 4 weeks of shadow, tune red-zone fire rates against
# observed PR history (see docs/agent-redline-ci-proposal.md §4) and:
#   1. drop continue-on-error on the boundary job
#   2. flip modes.default to binding in agent-policy.yaml — the reporter
#      will then emit exit 2 for unmet checkpoints / pr-size fail too
#   3. add the two checks to main's required-status-checks (Settings →
#      Branches), if collaborators exist

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  boundary:
    name: Boundary check (import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Run import-linter via adapter
        run: |
          mkdir -p build
          python scripts/run-import-linter.py --out build/import-linter-report.json
        # Exits 1 on violations; reporter step surfaces them. Drop this once
        # shadow window is done (see header comment).
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: boundary-report
          path: build/import-linter-report.json
          if-no-files-found: error

  report:
    name: agent-redline report
    needs: boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: boundary-report
          path: build/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema

      - name: Run reporter
        id: report
        # Capture the reporter's exit code without failing the step yet —
        # the sticky comment must post regardless. The "Enforce reporter
        # exit code" step below translates exit 2 (binding-mode hard fail)
        # into a check failure.
        #
        # Reporter exit codes:
        #   0  clean (BLUE / no checkpoints / contracts pass)
        #   1  warnings (gray-zone / unmet checkpoint in shadow mode /
        #      watch-list touched / pr-size warn) — surfaces in comment,
        #      does NOT block CI
        #   2  binding-mode hard fail (boundary violation, unsatisfied
        #      checkpoint under binding, pr-size fail under binding) —
        #      blocks CI
        #
        # Without the `set +e` + capture pattern, bash's default `-e` mode
        # makes ANY non-zero reporter exit fail the step. The comment
        # action and the enforce step never run, the verdict computes but
        # never reaches a human, and shadow mode's "surface, don't block"
        # contract silently breaks.
        run: |
          set +e
          mkdir -p build
          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            > build/changed-files.txt
          LINES_CHANGED=$(git diff --shortstat \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            | awk '{for (i=1;i<=NF;i++) if ($i ~ /insertions?|deletions?/) s+=$(i-1)} END{print s+0}')
          python scripts/agent-redline-report.py \
            --policy agent-policy.yaml \
            --changed-files build/changed-files.txt \
            --lines-changed "${LINES_CHANGED:-0}" \
            --pr-labels "${{ join(github.event.pull_request.labels.*.name, ',') }}" \
            --json-out build/verdict.json \
            --comment-out build/comment.md
          EXIT=$?
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          echo "--- verdict.json ---" && cat build/verdict.json
          echo "--- comment.md ---" && cat build/comment.md
          echo "reporter exit code: $EXIT"

      - name: Post sticky PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: build/comment.md
          header: agent-redline

      - name: Upload verdict artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-redline-verdict
          path: |
            build/verdict.json
            build/comment.md

      - name: Enforce reporter exit code
        # Fail the report job (and thus the required check) only on exit 2.
        # Exit codes 0 and 1 leave the job green; the comment surfaces
        # warnings without blocking merge.
        run: |
          EXIT="${{ steps.report.outputs.exit_code }}"
          if [[ "$EXIT" == "2" ]]; then
            echo "Reporter exited 2 (binding-mode hard fail). Failing the report check."
            exit 1
          fi
          echo "Reporter exited $EXIT — non-blocking."
